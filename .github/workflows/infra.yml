name: infra
# The AWS stack: type-checks it (no AWS access, nothing is deployed).
on:
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]
  push:
    branches: [main]
    paths: [infra/**, .github/workflows/infra.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
